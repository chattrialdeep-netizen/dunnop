<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 The Big Reveal</title>
<meta name="description" content="Enter your code to reveal your graduation photo!">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body>

<div class="ambient-layer" id="ambientLayer" aria-hidden="true"></div>

<button id="muteBtn" class="mute-btn" type="button" aria-label="Toggle sound">🔊</button>

<main class="stage">

  <section id="entryScreen" class="panel entry-panel">
    <p class="emoji-row" aria-hidden="true">🎓🎉🎊✨🥳🏆📜🌟💫🎈🙌🔥💯😍🥂🍾🌈⭐🤩👏</p>
    <h1 class="glitch-title" data-text="ENTER CODE">🎓✨🎉 ENTER CODE 🥳🎊🏆</h1>
    <p class="subtitle">🔑✨ Enter your code. 💥🔥 Unleash chaos. 📸🌟 See your photo. 🎓✨🎊🙌🥳🎉💯</p>

    <form id="codeForm" class="code-form" autocomplete="off">
      <input
        id="codeInput"
        class="code-input"
        type="text"
        name="code"
        placeholder="✍️🔠 enter your code... 🔑✨"
        aria-label="Enter your code"
        maxlength="64"
        required
      >
      <button type="submit" class="unlock-btn">🔓✨ UNLOCK 🚀🔥🎉</button>
    </form>

    <p id="errorMsg" class="error-msg" role="alert" aria-live="assertive"></p>

    <p class="hint">👀🤫 psst — try <code>jashdkjas9348</code> 🔥✨😉</p>
    <p class="emoji-row" aria-hidden="true">🎉🎊🥳🎓🏆📸🌈⭐💫🔥💯🙌👏🍾🥂🤩😍✨🎈🌟</p>
  </section>

  <section id="revealScreen" class="panel reveal-panel" hidden>
    <p class="emoji-row" aria-hidden="true">🎉🎊🥳🎓🏆📸🌈⭐💫🔥💯🙌👏🍾🥂🤩😍✨🎈🌟</p>
    <h2 id="congratsText" class="congrats-text">🎉🥳🎊 CONGRATULATIONS! 🎓🏆🙌🎈✨</h2>
    <div class="photo-frame">
      <img id="revealImg" class="reveal-img" src="" alt="Your graduation photo">
    </div>
    <p id="revealName" class="reveal-name"></p>
    <button id="againBtn" class="again-btn" type="button">🔄✨ Try Another Code 🎲🔥🎉</button>
    <p class="emoji-row" aria-hidden="true">🎓🎉🎊✨🥳🏆📜🌟💫🎈🙌🔥💯😍🥂🍾🌈⭐🤩👏</p>
  </section>

</main>

<canvas id="confettiCanvas" class="confetti-canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
