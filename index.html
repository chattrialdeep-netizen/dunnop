<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS_TERMINAL</title>
<meta name="description" content="Enter your access code to decrypt your message.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
</head>
<body>

<div class="letter-glitch" id="letterGlitch" aria-hidden="true">
  <canvas id="glitchCanvas"></canvas>
  <div class="letter-glitch-scanlines"></div>
  <div class="letter-glitch-vignette-center"></div>
</div>

<button id="muteBtn" class="mute-btn" type="button" aria-label="Toggle sound">🔊</button>

<main class="stage">

  <section id="entryScreen" class="auth-card">
    <span class="auth-card__accent auth-card__accent--top" aria-hidden="true"></span>
    <span class="auth-card__accent auth-card__accent--left" aria-hidden="true"></span>
    <span class="auth-card__accent auth-card__accent--bl" aria-hidden="true"></span>
    <span class="auth-card__accent auth-card__accent--br" aria-hidden="true"></span>
    <span class="auth-card__tick auth-card__tick--tl" aria-hidden="true"></span>
    <span class="auth-card__tick auth-card__tick--tr" aria-hidden="true"></span>
    <span class="auth-card__tick auth-card__tick--bl" aria-hidden="true"></span>
    <span class="auth-card__tick auth-card__tick--br" aria-hidden="true"></span>

    <header class="auth-card__bar">
      <span class="auth-card__bar-host"><span class="auth-card__prompt">$_</span> localhost:22</span>
      <span class="auth-card__bar-dots" aria-hidden="true">
        <span class="auth-card__dot"></span>
        <span class="auth-card__dot"></span>
        <span class="auth-card__dot auth-card__dot--active"></span>
      </span>
    </header>

    <div class="auth-card__body">
      <div class="auth-card__title-wrap">
        <span class="auth-card__bracket auth-card__bracket--left" aria-hidden="true"></span>
        <h1 class="auth-card__title">AUTHENTICATION</h1>
        <span class="auth-card__bracket auth-card__bracket--right" aria-hidden="true"></span>
      </div>
      <div class="auth-card__title-rule" aria-hidden="true"></div>

      <p class="auth-card__desc">Enter code to continue</p>

      <form id="codeForm" class="auth-card__form" autocomplete="off" novalidate>
        <div id="codeField" class="auth-card__field">
          <span class="auth-card__field-active" aria-hidden="true"></span>
          <span class="auth-card__field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="1.2"></rect>
              <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"></path>
            </svg>
          </span>
          <label for="codeInput" class="sr-only">Enter your code</label>
          <input
            id="codeInput"
            class="auth-card__input"
            type="text"
            name="code"
            placeholder="Enter your code"
            maxlength="64"
            required
          >
          <span class="auth-card__field-indicator" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
        </div>

        <button type="submit" id="verifyBtn" class="auth-card__submit">
          <span class="auth-card__submit-label">ENTER</span>
          <span class="auth-card__submit-spinner" aria-hidden="true"></span>
        </button>
      </form>
    </div>

    <footer id="statusBar" class="auth-card__status">
      <span class="auth-card__status-dot" aria-hidden="true"></span>
      <span id="statusText" class="auth-card__status-text" role="status" aria-live="polite">Waiting for input<span class="auth-card__cursor">_</span></span>
    </footer>
  </section>

  <section id="revealScreen" class="panel reveal-panel pixel-corners-lg" hidden>
    <div id="crtMonitor" class="crt-monitor">
      <div class="crt-bezel pixel-corners-lg">
        <div class="crt-led"></div>
        <div class="crt-screen" id="crtScreen" title="tap to skip">
          <div class="crt-scanlines"></div>
          <pre id="terminalOutput" class="terminal-output"></pre>
        </div>
      </div>
      <div class="crt-neck"></div>
      <div class="crt-stand"></div>
    </div>

    <button id="againBtn" class="again-btn pixel-corners" type="button">[ GO BACK ]</button>
  </section>

</main>

<canvas id="confettiCanvas" class="confetti-canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
