<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS_TERMINAL</title>
<meta name="description" content="Enter your access code to decrypt your message.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
</head>
<body>

<div class="letter-glitch" id="letterGlitch" aria-hidden="true">
  <canvas id="glitchCanvas"></canvas>
  <div class="letter-glitch-scanlines"></div>
  <div class="letter-glitch-vignette-center"></div>
</div>

<button id="muteBtn" class="mute-btn" type="button" aria-label="Toggle sound">🔊</button>

<main class="stage">

  <section id="entryScreen" class="panel entry-panel pixel-corners-lg">
    <h1 class="glitch-title" data-text="ACCESS TERMINAL">ACCESS TERMINAL</h1>
    <p class="subtitle">&gt; enter access code to decrypt your message_</p>

    <form id="codeForm" class="code-form" autocomplete="off">
      <input
        id="codeInput"
        class="code-input pixel-corners"
        type="text"
        name="code"
        placeholder="ENTER CODE"
        aria-label="Enter your code"
        maxlength="64"
        required
      >
      <button type="submit" class="unlock-btn pixel-corners">DECRYPT</button>
    </form>

    <p id="errorMsg" class="error-msg" role="alert" aria-live="assertive"></p>

    <p class="hint">psst — try <code>jashdkjas9348</code></p>
  </section>

  <section id="revealScreen" class="panel reveal-panel pixel-corners-lg" hidden>
    <h2 class="glitch-title small-glitch" data-text="MESSAGE DECRYPTED">MESSAGE DECRYPTED</h2>

    <div id="crtMonitor" class="crt-monitor">
      <div class="crt-bezel pixel-corners-lg">
        <div class="crt-led"></div>
        <div class="crt-screen" id="crtScreen" title="tap to skip">
          <div class="crt-scanlines"></div>
          <pre id="terminalOutput" class="terminal-output"></pre>
        </div>
      </div>
      <div class="crt-neck"></div>
      <div class="crt-stand"></div>
    </div>

    <button id="againBtn" class="again-btn pixel-corners" type="button">[ NEW TRANSMISSION ]</button>
  </section>

</main>

<canvas id="confettiCanvas" class="confetti-canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
